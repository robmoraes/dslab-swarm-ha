# Deploy: docker stack deploy -c stacks/excalidraw.yml excalidraw
# Configure o DNS de excalidraw.swarm.dslab.dev.br para os EIPs dos managers.
# Editor sem servidor de colaboracao; os desenhos ficam no navegador, nao no container.
services:
  excalidraw:
    image: excalidraw/excalidraw:latest

    networks:
      - traefik-public

    deploy:
      replicas: 3

      placement:
        constraints:
          - node.role == worker

      labels:
        - traefik.enable=true
        - traefik.http.routers.excalidraw.rule=Host(`excalidraw.swarm.dslab.dev.br`)
        - traefik.http.routers.excalidraw.entrypoints=web
        - traefik.http.routers.excalidraw.service=excalidraw
        - traefik.http.services.excalidraw.loadbalancer.server.port=80

networks:
  traefik-public:
    external: true
